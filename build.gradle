plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

checkstyle {
    toolVersion = '10.12.4'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

javafx {
    version = "17"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

repositories {
    mavenCentral()
}

// Manually pull in JavaFX natives for all platforms
def javafxVersion = "17.0.2"
def javafxModules = ['javafx-controls', 'javafx-fxml', 'javafx-graphics', 'javafx-base']
def javafxPlatforms = ['win', 'linux', 'mac']

dependencies {
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.10.0'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.10.0'

    // Include native libs for all platforms so the fat JAR works cross-platform
    javafxModules.each { mod ->
        javafxPlatforms.each { platform ->
            implementation "org.openjfx:${mod}:${javafxVersion}:${platform}"
        }
    }
}

test {
    useJUnitPlatform()
    jvmArgs '-ea'

    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
        showStandardStreams = false
    }
}

application {
    mainClass.set("adolf.Launcher")
}

shadowJar {
    archiveBaseName = "adolf"
    archiveClassifier = null

    // Merge service files (important for JavaFX)
    mergeServiceFiles()
}

run {
    standardInput = System.in
    jvmArgs '-ea'
}